<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm - MY SHOP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
<div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>MY SHOP</h2>
        <nav>
            <a href="admin.html">Dashboard</a>
            <a href="admin-products.html">Quản lý sản phẩm</a>
            <a href="#">Quản lý danh mục</a>
            <a href="#">Quản lý đơn hàng</a>
            <a href="#">Quản lý người dùng</a>
            <a href="../index.html">Về trang bán hàng</a>
        </nav>
    </aside>

    <!-- MAIN -->
    <main class="admin-main">
        <header class="admin-header">
            <h1>Quản lý sản phẩm</h1>
            <div>Xin chào, Admin</div>
        </header>

        <!-- TOOLBAR: SEARCH + SORT + ADD -->
        <section class="admin-section">
            <div class="d-flex flex-wrap gap-2 align-items-center mb-3">

                <input
                    type="text"
                    id="searchInput"
                    class="form-control"
                    style="max-width: 260px;"
                    placeholder="Tìm kiếm theo tên sản phẩm..."
                >
                <button type="button" class="btn btn-outline-primary" onclick="searchProduct()">
                    Tìm kiếm
                </button>

                <select id="sortPrice" class="form-select" style="max-width: 220px;" onchange="sortProducts()">
                    <option value="">-- Sắp xếp theo giá --</option>
                    <option value="asc">Giá thấp → cao</option>
                    <option value="desc">Giá cao → thấp</option>
                </select>

                <button type="button" class="btn btn-success ms-auto" onclick="openAddProduct()">
                    + Thêm sản phẩm
                </button>
            </div>

            <!-- PRODUCT TABLE -->
            <table class="table table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Giá</th>
                        <th>Số lượng</th>
                        <th>Danh mục</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <!-- render bằng renderProducts() trong admin.js -->
                </tbody>
            </table>
        </section>

    </main>
</div>

<!-- MODAL: ADD / EDIT PRODUCT -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="productForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Thêm sản phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <input type="hidden" id="productId">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Tên sản phẩm</label>
                            <input type="text" id="productName" class="form-control" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Alias</label>
                            <input type="text" id="productAlias" class="form-control" placeholder="Để trống sẽ tự tạo từ tên">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Giá (VNĐ)</label>
                            <input type="number" id="productPrice" class="form-control" min="0" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Số lượng</label>
                            <input type="number" id="productQuantity" class="form-control" min="0" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Danh mục</label>
                            <select id="productCategory" class="form-select">
                                <option value="">-- Chọn danh mục --</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Size (cách nhau bởi dấu phẩy)</label>
                            <input type="text" id="productSizes" class="form-control" placeholder="38,39,40">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Link ảnh</label>
                            <input type="text" id="productImage" class="form-control" placeholder="https://...">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Mô tả ngắn</label>
                            <input type="text" id="shortDescription" class="form-control">
                        </div>

                        <div class="col-12">
                            <label class="form-label">Mô tả chi tiết</label>
                            <textarea id="description" class="form-control" rows="3"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="../js/admin.js"></script>
</body>
</html>
