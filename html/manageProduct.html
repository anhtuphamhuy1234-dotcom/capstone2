<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sản phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h2>MY SHOP</h2>

        <nav>

            <a href="admin.html">
                Dashboard
            </a>

            <a href="manageProduct.html">
                Quản lý sản phẩm
            </a>

            <a href="#">
                Quản lý danh mục
            </a>

            <a href="#">
                Quản lý đơn hàng
            </a>

            <a href="#">
                Quản lý người dùng
            </a>

            <a href="../index.html">
                Về trang bán hàng
            </a>

        </nav>

    </aside>


    <!-- MAIN -->
    <main class="admin-main">

        <!-- HEADER -->
        <header class="admin-header">

            <h1>Quản lý sản phẩm</h1>

            <button
                type="button"
                class="btn btn-primary"
                onclick="openAddProduct()">

                + Thêm sản phẩm

            </button>

        </header>


        <!-- SEARCH -->
        <div class="admin-tools">

    <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Tìm sản phẩm...">

    <button
        type="button"
        class="btn btn-primary"
        onclick="searchProduct()">

        Tìm kiếm

    </button>

    <button
        type="button"
        class="btn btn-secondary"
        onclick="loadProducts()">

        Tất cả

    </button>

    <select
        id="sortPrice"
        class="form-select"
        onchange="sortProducts()">

        <option value="">
            Sắp xếp theo giá
        </option>

        <option value="asc">
            Giá thấp → cao
        </option>

        <option value="desc">
            Giá cao → thấp
        </option>

    </select>

</div>


        <!-- PRODUCT TABLE -->
        <div class="table-responsive">

            <table class="table">

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Hình ảnh</th>

                        <th>Tên sản phẩm</th>

                        <th>Giá</th>

                        <th>Số lượng</th>

                        <th>Danh mục</th>

                        <th>Thao tác</th>

                    </tr>

                </thead>


                <tbody id="productTableBody">

                    <!-- JavaScript sẽ thêm sản phẩm vào đây -->

                </tbody>

            </table>

        </div>

    </main>

</div>


<!-- ============================= -->
<!-- MODAL THÊM / SỬA SẢN PHẨM -->
<!-- ============================= -->

<div
    class="modal fade"
    id="productModal"
    tabindex="-1">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <!-- MODAL HEADER -->
            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="modalTitle">

                    Thêm sản phẩm

                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>


            <!-- FORM -->
            <form id="productForm">

                <div class="modal-body">

                    <!-- ID -->
                    <input
                        type="hidden"
                        id="productId">


                    <!-- TÊN -->
                    <div class="mb-3">

                        <label
                            for="productName"
                            class="form-label">

                            Tên sản phẩm

                        </label>

                        <input
                            type="text"
                            id="productName"
                            class="form-control"
                            required>

                    </div>


                    <!-- ALIAS -->
                    <div class="mb-3">

                        <label
                            for="productAlias"
                            class="form-label">

                            Alias

                        </label>

                        <input
                            type="text"
                            id="productAlias"
                            class="form-control">

                    </div>


                    <!-- GIÁ -->
                    <div class="mb-3">

                        <label
                            for="productPrice"
                            class="form-label">

                            Giá

                        </label>

                        <input
                            type="number"
                            id="productPrice"
                            class="form-control"
                            min="0"
                            required>

                    </div>


                    <!-- SỐ LƯỢNG -->
                    <div class="mb-3">

                        <label
                            for="productQuantity"
                            class="form-label">

                            Số lượng

                        </label>

                        <input
                            type="number"
                            id="productQuantity"
                            class="form-control"
                            min="0"
                            required>

                    </div>


                    <!-- DANH MỤC -->
                    <div class="mb-3">

                        <label
                            for="productCategory"
                            class="form-label">

                            Danh mục

                        </label>

                        <select
                            id="productCategory"
                            class="form-select"
                            required>

                            <option value="">
                                -- Chọn danh mục --
                            </option>

                        </select>

                    </div>


                    <!-- MÔ TẢ NGẮN -->
                    <div class="mb-3">

                        <label
                            for="shortDescription"
                            class="form-label">

                            Mô tả ngắn

                        </label>

                        <textarea
                            id="shortDescription"
                            class="form-control"
                            rows="2">
                        </textarea>

                    </div>


                    <!-- MÔ TẢ -->
                    <div class="mb-3">

                        <label
                            for="description"
                            class="form-label">

                            Mô tả

                        </label>

                        <textarea
                            id="description"
                            class="form-control"
                            rows="4">
                        </textarea>

                    </div>


                    <!-- SIZE -->
                    <div class="mb-3">

                        <label
                            for="productSizes"
                            class="form-label">

                            Sizes

                        </label>

                        <input
                            type="text"
                            id="productSizes"
                            class="form-control"
                            placeholder="Ví dụ: S,M,L,XL">

                    </div>


                    <!-- HÌNH ẢNH -->
                    <div class="mb-3">

                        <label
                            for="productImage"
                            class="form-label">

                            Link hình ảnh

                        </label>

                        <input
                            type="text"
                            id="productImage"
                            class="form-control"
                            placeholder="https://...">

                    </div>

                </div>


                <!-- FOOTER -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Hủy

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Lưu sản phẩm

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script src="../js/admin.js"></script>
</body>

</html>
