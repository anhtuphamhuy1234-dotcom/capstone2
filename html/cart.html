<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - MY SHOP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <header class="header">
    <div class="logo">
      <a href="index.html">MY SHOP</a>
    </div>
    <nav class="navbar">
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="btn btn-outline-primary active">
        <i class="fa-solid fa-cart-shopping"></i> Giỏ hàng
      </a>
    </div>
  </header>

  <main class="container my-5">
    <h2 class="mb-4 fw-bold">Giỏ hàng của bạn</h2>

    <div class="table-responsive">
      <table class="table table-bordered align-middle text-center">
        <thead class="table-dark">
          <tr>
            <th>STT</th>
            <th>Hình ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="tblCart">
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-between align-items-center mt-4">
      <a href="products.html" class="btn btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Tiếp tục mua hàng
      </a>
      <div class="text-end">
        <h4>Tổng tiền: <span id="totalMoney" class="text-danger fw-bold">0</span> VNĐ</h4>
        <button id="btnPay" class="btn btn-success btn-lg mt-2">
          <i class="fa-solid fa-credit-card"></i> Thanh toán
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/cartItem.js"></script>
  <script src="../js/cart.js"></script>
</body>

</html>
